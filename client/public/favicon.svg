<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="polarisPeak" x1="16" y1="3" x2="16" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="polarisCore" x1="16" y1="5" x2="16" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Triangular Polar Navigation Peak -->
  <path
    d="M16 4.5 L27 26.5 H5 L16 4.5Z"
    fill="url(#polarisCore)"
    stroke="url(#polarisPeak)"
    stroke-width="2.5"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Horizon Horizon Bar -->
  <path
    d="M9.5 19.5 H22.5"
    stroke="#38BDF8"
    stroke-width="1.75"
    stroke-linecap="round"
  />

  <!-- 4-Point Polaris Navigation Star -->
  <path
    d="M16 13 Q16 16.5 19.5 16.5 Q16 16.5 16 20 Q16 16.5 12.5 16.5 Q16 16.5 16 13Z"
    fill="#FFFFFF"
  />
  <circle cx="16" cy="16.5" r="0.85" fill="#E0F2FE" />
</svg>